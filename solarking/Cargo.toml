[package]
name = "solarking"
version = "0.7.0"
edition = "2021"
description = "Eternal Solar Kingdom — sovereign Rust core engine"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
getrandom = "0.2"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
argon2 = "0.5"
tiny-keccak = { version = "2", features = ["keccak"] }

[dev-dependencies]
tempfile = "3"
